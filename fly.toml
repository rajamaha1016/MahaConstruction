app = "maha-construction"
primary_region = "sin" # Singapore (closest to India / Asia)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/up"

[env]
  APP_NAME = "Maha Construction"
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/database/database.sqlite"
  DB_SEED_ON_BOOT = "true"

[[mounts]]
  source = "maha_storage"
  destination = "/var/www/html/public/uploads"
