name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: maha_construction_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, zip, gd
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check JavaScript Syntax
      run: node -c public/js/app.js

    - name: Copy .env
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Create Storage and Cache Directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/{sessions,views,cache/data,testing}
        mkdir -p storage/logs storage/app/public
        chmod -R 777 bootstrap/cache storage

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Verify Configuration Caching
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
        php artisan optimize:clear

    - name: Execute Tests via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"
      run: php artisan test
